name: Accessibility and usability quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-quality:
    name: Release quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Check code quality
        run: npm run lint

      - name: Build production site
        run: npm run build

      - name: Check types
        run: ./node_modules/.bin/tsc --noEmit --incremental false

      - name: Check security and bundle budgets
        run: npm run release:guard

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Run product checks
        run: npm run test:unit

      - name: Audit accessibility and usability
        run: npm run ux:audit

      - name: Validate Cloudflare package without publishing
        run: npm run deploy:cloudflare:dry-run

      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-usability-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
